# Secrets Configuration Template
# Copy this file to secrets.yml and fill in your actual secrets
# NEVER commit secrets.yml to version control

# Database Configuration
database:
  url: "postgresql://username:password@host:port/database"
  host: "your-db-host"
  port: 5432
  name: "your-db-name"
  username: "your-db-username"
  password: "your-secure-db-password"

# Redis Configuration
redis:
  url: "redis://host:port"
  host: "your-redis-host"
  port: 6379
  password: "your-secure-redis-password"

# JWT Configuration
jwt:
  secret: "your-very-secure-jwt-secret-at-least-256-bits"
  refresh_secret: "your-very-secure-refresh-secret-at-least-256-bits"

# n8n Configuration
n8n:
  host: "your-n8n-host"
  user: "your-n8n-username"
  password: "your-secure-n8n-password"
  api_key: "your-n8n-api-key"
  webhook_url: "https://yourdomain.com/n8n/webhook"

# Session Configuration
session:
  secret: "your-very-secure-session-secret"

# SMTP Configuration
smtp:
  host: "smtp.yourdomain.com"
  port: 587
  username: "noreply@yourdomain.com"
  password: "your-secure-smtp-password"
  from: "noreply@yourdomain.com"

# SSL Configuration
ssl:
  cert_path: "/path/to/your/certificate.pem"
  key_path: "/path/to/your/private-key.pem"

# External Services
external_services:
  sentry:
    dsn: "https://your-sentry-dsn"
  
  datadog:
    api_key: "your-datadog-api-key"
  
  new_relic:
    license_key: "your-newrelic-license-key"
  
  aws:
    access_key_id: "your-aws-access-key"
    secret_access_key: "your-aws-secret-key"
    region: "us-east-1"
    s3_bucket: "your-backup-bucket"

# Domain Configuration
domains:
  primary: "yourdomain.com"
  api: "api.yourdomain.com"
  cdn: "cdn.yourdomain.com"

# CORS Origins
cors:
  origins:
    - "https://yourdomain.com"
    - "https://www.yourdomain.com"
    - "https://app.yourdomain.com"